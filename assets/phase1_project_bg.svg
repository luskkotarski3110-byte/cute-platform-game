 <rect x="485" y="185" width="25" height="42" rx="8" fill="#72598c"/>
 <rect x="610" y="185" width="25" height="42" rx="8" fill="#72598c"/>
</g>
<!-- nearer cliffs -->
<g>
 <path d="M0 365Q80 330 155 360L145 540H0Z" fill="url(#rock)"/>
 <path d="M0 365Q75 325 165 360Q120 390 70 375Q35 390 0 365Z" fill="url(#grass)"/>
 <path d="M245 390Q315 350 385 385L375 540H250Z" fill="url(#rock)"/>
 <path d="M235 390Q315 350 395 385Q350 415 300 398Q270 412 235 390Z" fill="url(#grass)"/>
 <path d="M760 365Q835 330 960 365V540H770Z" fill="url(#rock)"/>
 <path d="M750 365Q840 325 960 365Q900 395 845 378Q795 395 750 365Z" fill="url(#grass)"/>
</g>
<!-- flowers on cliffs -->
<g fill="#ffd0e6" stroke="#9e679a" stroke-width="2">
 <circle cx="65" cy="345" r="9"/><circle cx="48" cy="353" r="9"/><circle cx="82" cy="353" r="9"/><circle cx="65" cy="360" r="7"/>
 <circle cx="320" cy="365" r="9"/><circle cx="303" cy="373" r="9"/><circle cx="337" cy="373" r="9"/><circle cx="320" cy="380" r="7"/>
 <circle cx="855" cy="345" r="9"/><circle cx="838" cy="353" r="9"/><circle cx="872" cy="353" r="9"/><circle cx="855" cy="360" r="7"/>
</g>
<g fill="#ffe68d"><circle cx="65" cy="353" r="4"/><circle cx="320" cy="373" r="4"/><circle cx="855" cy="353" r="4"/></g>
<!-- sparkles -->
<g fill="#fff4ff"><circle cx="270" cy="120" r="4"/><circle cx="555" cy="95" r="3"/><circle cx="900" cy="250" r="4"/><path d="M295 190l6 15 15 6-15 6-6 15-6-15-15-6 15-6z"/></g>
<!-- lower water -->
<path d="M0 480Q170 445 330 485T650 480T960 475V540H0Z" fill="url(#water)" opacity=".9"/>

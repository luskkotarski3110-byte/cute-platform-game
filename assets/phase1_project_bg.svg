<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#7050c8"/><stop offset=".5" stop-color="#b879d9"/><stop offset="1" stop-color="#f1b8e8"/></linearGradient>
 <linearGradient id="rock" x2="0" y2="1"><stop stop-color="#b9a1c8"/><stop offset="1" stop-color="#6f5a8d"/></linearGradient>
 <linearGradient id="grass" x2="0" y2="1"><stop stop-color="#d5ee82"/><stop offset="1" stop-color="#6eae5d"/></linearGradient>
 <linearGradient id="water" x2="0" y2="1"><stop stop-color="#d5efff"/><stop offset="1" stop-color="#82c9e6"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<rect width="960" height="540" fill="url(#sky)"/>
<!-- dreamy clouds -->
<g fill="#f6d6f2" opacity=".7">
 <path d="M0 175Q45 120 100 165Q130 105 195 155Q240 150 260 205H0Z"/>
 <path d="M650 110Q700 55 750 105Q790 45 855 105Q915 80 960 135V205H650Z"/>
</g>
<!-- moon -->
<circle cx="810" cy="95" r="45" fill="#f4d8ff" opacity=".55"/>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7b315f">
<title>Zip Zip — Fase 1</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<section id="gameScreen" class="game-screen">
  <div class="topbar"><button id="pauseBtn" aria-label="Pausar">Ⅱ</button><strong id="phaseTitle">Fase 1 · Jardim Encantado</strong><span id="objective">Colete 4 fragmentos</span></div>
  <div class="game-wrap"><canvas id="game" width="960" height="540"></canvas></div>
  <div class="touch-controls" aria-label="Controles"><button data-key="left">◀</button><button data-key="jump">⬆</button><button data-key="right">▶</button></div>
  <p class="hint">Celular: botões • PC: ← → / A D + Espaço • Esc pausa</p>
</section>
<section id="pause" class="overlay hidden"><h2>Jogo pausado</h2><button id="resumeBtn">Continuar</button><button id="restartBtn" class="secondary">Recomeçar fase</button><button id="menuBtn" class="secondary">Menu principal</button></section>
<section id="story" class="overlay hidden"><div id="storyText"></div><button id="storyNext">Começar fase</button></section>
</main>
<script src="game.js"></script>
</body>
</html>

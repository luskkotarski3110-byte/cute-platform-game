<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7b315f">
<title>Zip Zip — Aventura dos Hamsters</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#24101f}
#menu{position:relative;width:100%;height:100svh;min-height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.menu-background{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.menu-overlay{position:absolute;inset:0;background:rgba(25,8,38,.12);z-index:1;pointer-events:none}
.menu-art{position:relative;z-index:2;width:min(94vw,440px);max-height:96svh;display:flex;align-items:center;justify-content:center}
.menu-art img{display:block;width:100%;height:auto;max-height:96svh;object-fit:contain;filter:drop-shadow(0 18px 38px rgba(20,5,35,.4))}
.menu-hit{position:absolute;left:24%;width:52%;height:6.8%;border:0;background:transparent;padding:0;cursor:pointer;z-index:4;border-radius:999px}
.hit-new{top:57.1%}.hit-continue{top:65.7%}.hit-shop{top:74.2%}.hit-how{top:82.5%}
.menu-hit:active{transform:scale(.985)}

#info{position:fixed;z-index:20;left:50%;bottom:18px;transform:translateX(-50%);width:min(88vw,430px);padding:16px 18px;border-radius:22px;background:rgba(43,19,60,.97);border:1px solid rgba(255,220,245,.3);box-shadow:0 15px 40px rgba(0,0,0,.38);color:#fff;text-align:center;font-size:14px;line-height:1.55}
#info button{margin-top:10px;border:0;border-radius:999px;padding:8px 18px;background:#ffc0df;color:#4a214f;font-weight:900}.hidden{display:none!important}
</style>
</head>
<body>
<main>
<section id="menu">
<img class="menu-background" src="assets/zipzip-bg.png" alt="">
<div class="menu-overlay"></div>
<div class="menu-art">
<img src="assets/zipzip_menu_panel.webp" alt="Menu do Zip Zip">

<button class="menu-hit hit-new" id="startBtn" aria-label="Novo jogo"></button>
<button class="menu-hit hit-continue" id="continueBtn" aria-label="Continuar"></button>
<button class="menu-hit hit-shop" id="shopBtn" aria-label="Loja"></button>
<button class="menu-hit hit-how" id="howBtn" aria-label="Como jogar"></button>
</div>
<div id="info" class="hidden"></div>
</section>
</main>
<script>
const info=document.getElementById('info');
function showInfo(title,msg){info.innerHTML='<strong>'+title+'</strong><br>'+msg+'<br><button id="closeInfo">Fechar</button>';info.classList.remove('hidden');document.getElementById('closeInfo').onclick=()=>info.classList.add('hidden')}
document.getElementById('startBtn').onclick=()=>location.href='campaign.html?new=1';
document.getElementById('continueBtn').onclick=()=>location.href='campaign.html';
document.getElementById('shopBtn').onclick=(e)=>{e.preventDefault();showInfo('Loja','A loja do Zip Zip ainda está em desenvolvimento.');};
document.getElementById('howBtn').onclick=()=>showInfo('Como jogar','No celular, use os botões da fase. No PC: A/D ou setas para andar e Espaço, W ou ↑ para pular.');
</script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7b315f">
<title>Zip Zip — Aventura dos Hamsters</title>
<link rel="stylesheet" href="style.css">
<style>
#menu{position:relative;min-height:100svh;overflow:hidden;background:#24101f;display:flex;align-items:center;justify-content:center}
.menu-background{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:0}
.menu-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(35,10,55,.08),rgba(25,8,38,.32));z-index:1;pointer-events:none}
.menu-art{position:relative;z-index:2;width:min(92vw,430px);height:min(94svh,1105px);display:flex;justify-content:center;align-items:center}
.menu-art img{width:100%;height:auto;max-height:100%;object-fit:contain;display:block;filter:drop-shadow(0 22px 42px rgba(20,5,35,.42))}
.menu-hit{position:absolute;left:14%;width:72%;height:8.2%;border:0;background:transparent;cursor:pointer;border-radius:999px;padding:0}
.menu-hit:active{transform:scale(.985)}
.hit-new{top:57.2%}.hit-continue{top:66.2%}.hit-shop{top:75.2%}.hit-how{top:84.1%}
#info{position:fixed;z-index:20;left:50%;bottom:18px;transform:translateX(-50%);width:min(88vw,430px);padding:17px 18px;border-radius:22px;background:rgba(43,19,60,.97);border:1px solid rgba(255,220,245,.3);box-shadow:0 15px 40px rgba(0,0,0,.38);color:#fff;text-align:center;font-size:14px;line-height:1.55}
#info button{margin-top:10px;border:0;border-radius:999px;padding:8px 18px;background:#ffc0df;color:#4a214f;font-weight:900}
.hidden{display:none!important}
@media(max-height:650px){.menu-art{width:min(62vw,430px);height:96svh}}
</style>
</head>
<body>
<main>
<section id="menu" aria-label="Menu principal do Zip Zip">
<img class="menu-background" src="assets/zipzip-bg.png" alt="">
<div class="menu-overlay"></div>
<div class="menu-art">
<img src="assets/zipzip_menu_panel.webp" alt="Menu ilustrado de Zip Zip com hamster e opções Novo jogo, Continuar, Loja e Como jogar">
<button class="menu-hit hit-new" id="startBtn" aria-label="Novo jogo"></button>
<button class="menu-hit hit-continue" id="continueBtn" aria-label="Continuar"></button>
<button class="menu-hit hit-shop" id="shopBtn" aria-label="Loja"></button>
<button class="menu-hit hit-how" id="howBtn" aria-label="Como jogar"></button>
</div>
<div id="info" class="hidden"></div>
</section>
</main>
<script>
const info=document.getElementById('info');
function showInfo(title,text){
  info.innerHTML='<strong>'+title+'</strong><br>'+text+'<br><button id="closeInfo">Fechar</button>';
  info.classList.remove('hidden');
  document.getElementById('closeInfo').onclick=()=>info.classList.add('hidden');
}
document.getElementById('startBtn').onclick=()=>location.href='campaign.html?new=1';
document.getElementById('continueBtn').onclick=()=>location.href='campaign.html';
document.getElementById('shopBtn').onclick=()=>showInfo('Loja','A loja ainda está em desenvolvimento. Ela será usada para itens cosméticos e extras do Zip Zip.');
document.getElementById('howBtn').onclick=()=>showInfo('Como jogar','No celular, use os botões da fase. No PC: A/D ou ←/→ para andar e Espaço, W ou ↑ para pular. Colete os fragmentos, derrote os inimigos e chegue ao final.');
</script>
</body>
</html>

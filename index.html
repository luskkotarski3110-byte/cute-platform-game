<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>A Coroa Perdida</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<section id="menu" class="menu">
  <div class="menu-scene" aria-hidden="true">
    <div class="moon"></div><div class="cloud cloud-a"></div><div class="cloud cloud-b"></div>
    <div class="hill hill-back"></div><div class="hill hill-front"></div>
    <div class="flower flower-a">✿</div><div class="flower flower-b">✿</div><div class="flower flower-c">✿</div>
  </div>
  <div class="menu-content">
    <div class="game-mark"><span>✦</span><div class="crown">♕</div><span>✦</span></div>
    <p class="eyebrow">UMA AVENTURA EM MINIATURA</p>
    <h1>A Coroa <em>Perdida</em></h1>
    <p class="tagline">Um pequeno herói. Um mundo enorme. Uma coroa desaparecida.</p>
    <div class="menu-buttons">
      <button id="startBtn" class="primary">Novo jogo <span>›</span></button>
      <button id="continueBtn" class="secondary">Continuar</button>
      <button id="loreBtn" class="secondary">Lore</button>
      <button id="howBtn" class="secondary">Como jogar</button>
    </div>
    <div id="info" class="info hidden"></div>
    <p class="version">A COROA PERDIDA • PRÓLOGO</p>
  </div>
</section>

<section id="gameScreen" class="game-screen hidden">
  <div class="topbar"><button id="pauseBtn">Ⅱ</button><strong id="phaseTitle">Jardim da Rainha</strong><span id="objective">Recupere as coroas</span></div>
  <div class="game-wrap"><canvas id="game" width="960" height="540"></canvas></div>
  <div class="touch-controls"><button data-key="arrowleft">◀</button><button data-key="jump">⬆</button><button data-key="arrowright">▶</button></div>
  <p class="hint">Celular: botões • PC: ← → / A D + Espaço • Esc pausa</p>
</section>

<section id="pause" class="overlay hidden"><h2>Jogo pausado</h2><button id="resumeBtn">Continuar</button><button id="restartBtn" class="secondary">Recomeçar fase</button><button id="menuBtn" class="secondary">Menu principal</button></section>
<section id="story" class="overlay hidden"><div id="storyText"></div><button id="storyNext">Continuar</button></section>
</main>
<script src="game.js"></script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>A Coroa Perdida</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<section id="menu" class="menu">
  <div class="menu-scene" aria-hidden="true"><div class="moon"></div><div class="cloud cloud-a"></div><div class="cloud cloud-b"></div><div class="hill hill-back"></div><div class="hill hill-front"></div><div class="flower flower-a">✿</div><div class="flower flower-b">✿</div><div class="flower flower-c">✿</div></div>
  <div class="menu-content">
    <div class="game-mark"><span>✦</span><div class="crown">♕</div><span>✦</span></div>
    <p class="eyebrow">UMA AVENTURA EM MINIATURA</p>
    <h1>A Coroa <em>Perdida</em></h1>
    <p class="tagline">Um pequeno herói. Um mundo enorme. Uma coroa desaparecida.</p>
    <div class="menu-buttons">
      <button id="startBtn" class="primary">Novo jogo <span>›</span></button>
      <button id="continueBtn" class="secondary">Continuar</button>
      <button id="loreBtn" class="secondary">Lore</button>
      <button id="howBtn" class="secondary">Como jogar</button>
    </div>
    <div id="info" class="info hidden"></div>
    <p class="version">A COROA PERDIDA • PRÓLOGO</p>
  </div>
</section>
</main>
<script>
const lore='Há muito tempo, a pequena Rainha guardava uma coroa que não era apenas um símbolo. Ela mantinha o equilíbrio entre os lugares do reino. Certa manhã, a coroa desapareceu. Desde então, caminhos mudaram, criaturas estranhas apareceram e partes do reino ficaram isoladas.';
const info=document.getElementById('info');
document.getElementById('startBtn').onclick=()=>location.href='game.html?new=1';
document.getElementById('continueBtn').onclick=()=>location.href='game.html';
document.getElementById('loreBtn').onclick=()=>{info.innerHTML='<b>Lore</b><br>'+lore;info.classList.remove('hidden')};
document.getElementById('howBtn').onclick=()=>{info.innerHTML='<b>Como jogar</b><br>Ande com A/D ou ←/→. Pule com Espaço, W ou ⬆. Explore, enfrente inimigos e recupere a Coroa Real.';info.classList.remove('hidden')};
</script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7b315f">
<title>Zip Zip — Aventura dos Hamsters</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<section id="menu" class="menu">
  <img class="menu-background" src="./assets/zipzip-bg.png" alt="" aria-hidden="true">
  <div class="menu-overlay" aria-hidden="true"></div>
  <div class="menu-glow" aria-hidden="true"></div>
  <div class="menu-content">
    <div class="game-mark" aria-hidden="true"><span>✦</span><span class="sparkle-dot">•</span><span>✦</span></div>
    <p class="eyebrow">UMA AVENTURA DE HAMSTERS TREVOSOS</p>
    <h1 class="bubble-logo" aria-label="Zip Zip"><span>Zip</span> <em>Zip</em></h1>
    <p class="tagline">Pequenos heróis. Um mundo encantado. Uma aventura maior do que parece.</p>
    <div class="menu-buttons">
      <button id="startBtn" class="primary">Novo jogo <span>›</span></button>
      <button id="continueBtn" class="secondary">Continuar</button>
      <button id="loreBtn" class="secondary">Lore</button>
      <button id="howBtn" class="secondary">Como jogar</button>
    </div>
    <div id="info" class="info hidden"></div>
    <p class="version">ZIP ZIP • AVENTURA EM MINIATURA</p>
  </div>
</section>
</main>
<script>
const lore='Em um cantinho escondido do jardim existe um pequeno mundo de hamsters. Quando uma energia misteriosa começa a corromper os caminhos e transformar lugares encantados, Zip Zip parte em uma aventura para descobrir a origem do desequilíbrio. Entre jardins, bosques e vilas, cada pista revela um pouco mais sobre a história.';
const info=document.getElementById('info');
document.getElementById('startBtn').onclick=()=>location.href='campaign.html?new=1';
document.getElementById('continueBtn').onclick=()=>location.href='campaign.html';
document.getElementById('loreBtn').onclick=()=>{info.innerHTML='<b>Lore</b><br>'+lore;info.classList.remove('hidden')};
document.getElementById('howBtn').onclick=()=>{info.innerHTML='<b>Como jogar</b><br>Ande com A/D ou ←/→. Pule com Espaço, W ou ⬆. Explore, enfrente criaturas e descubra os segredos do mundo de Zip Zip.';info.classList.remove('hidden')};
</script>
</body>
</html>

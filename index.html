<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#6f2f73">
<title>Zip Zip — Aventura dos Hamsters</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#24102f;color:#fff}
#menu{position:relative;width:100%;height:100dvh;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:18px}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,8,48,.35),rgba(18,5,30,.82));}
.panel{position:relative;z-index:2;width:min(92vw,390px);padding:28px 22px 24px;border-radius:32px;background:linear-gradient(160deg,#8c4b9e,#55245f);border:3px solid rgba(255,255,255,.35);box-shadow:0 22px 60px rgba(0,0,0,.5);text-align:center}
.hamster{font-size:76px;line-height:1;margin-bottom:5px;filter:drop-shadow(0 8px 8px rgba(0,0,0,.3))}
h1{margin:0;font-size:52px;line-height:1;font-weight:1000;letter-spacing:-3px;text-shadow:0 5px 0 #3b1646,0 9px 18px rgba(0,0,0,.25)}
.sub{margin:10px 0 24px;font-size:14px;font-weight:700;opacity:.9}
.buttons{display:grid;gap:12px}
.menu-btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border:0;border-radius:18px;background:#f6b8df;color:#421748;font-size:18px;font-weight:900;text-decoration:none;box-shadow:0 6px 0 #8b4a83;cursor:pointer;touch-action:manipulation}
.menu-btn:active{transform:translateY(3px);box-shadow:0 3px 0 #8b4a83}
#info{position:fixed;z-index:10;left:50%;bottom:18px;transform:translateX(-50%);width:min(88vw,430px);padding:16px 18px;border-radius:22px;background:#35153f;border:1px solid rgba(255,255,255,.3);box-shadow:0 15px 40px rgba(0,0,0,.45);color:#fff;text-align:center;font-size:14px;line-height:1.55}
#info button{margin-top:10px;border:0;border-radius:999px;padding:9px 20px;background:#ffc3e4;color:#4a214f;font-weight:900}
.hidden{display:none!important}
</style>
</head>
<body>
<main id="menu">
<img class="bg" src="assets/zipzip-bg.png" alt="">
<div class="shade"></div>
<section class="panel" aria-label="Menu principal do Zip Zip">
<div class="hamster" aria-hidden="true">🐹</div>
<h1>Zip Zip</h1>
<div class="sub">Aventura dos Hamsters</div>
<nav class="buttons">
<a class="menu-btn" href="campaign.html?new=1">🎮 Novo jogo</a>
<a class="menu-btn" href="campaign.html">▶️ Continuar</a>
<button class="menu-btn" id="shopBtn" type="button">🛍️ Loja</button>
<button class="menu-btn" id="howBtn" type="button">📖 Como jogar</button>
</nav>
</section>
<div id="info" class="hidden"></div>
</main>
<script>
const info=document.getElementById('info');
function showInfo(title,msg){
info.innerHTML='<strong>'+title+'</strong><br>'+msg+'<br><button id="closeInfo">Fechar</button>';
info.classList.remove('hidden');
document.getElementById('closeInfo').onclick=()=>info.classList.add('hidden');
}
document.getElementById('shopBtn').onclick=()=>showInfo('Loja','A loja do Zip Zip ainda está em desenvolvimento.');
document.getElementById('howBtn').onclick=()=>showInfo('Como jogar','No celular, use os controles da fase. No PC: A/D ou setas para andar e Espaço, W ou ↑ para pular.');
</script>
</body>
</html>
